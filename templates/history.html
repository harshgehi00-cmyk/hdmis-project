<!DOCTYPE html>
<html>
<head>

    <title>Appointment History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef3f9;
            font-family:Segoe UI;
        }

        .card-box{
            background:white;
            padding:30px;
            border-radius:20px;
            margin-top:40px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card-box">

        <h2 class="mb-4">
            📜 Appointment History
        </h2>

        <table class="table table-hover">

            <thead class="table-primary">

                <tr>

                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Disease</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>PDF</th>
                    <th>QR</th>

                </tr>

            </thead>

            <tbody>

                {% for row in appointments %}

                <tr>

                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>
                    <td>{{ row[4] }}</td>

                    <td>

                        <span class="badge bg-success">
                            {{ row[5] }}
                        </span>

                    </td>

                    <td>
                        <a href="/prescription/{{ row[1] }}" class="btn btn-danger btn-sm">
                            PDF
                        </a>
                    </td>

                    <td>
                        <a href="/qr/{{ row[1] }}" class="btn btn-dark btn-sm">
                            QR
                        </a>
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<script src="/static/darkmode.js"></script>

</body>
</html>
