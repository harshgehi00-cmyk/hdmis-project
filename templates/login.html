<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HDMIS Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(15,23,42,0.7),
rgba(37,99,235,0.8)),
url('https://images.unsplash.com/photo-1584982751601-97dcc096659c?q=80&w=1600');

background-size:cover;
overflow:hidden;
}

.login-box{
width:430px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(18px);
padding:45px;
border-radius:30px;
color:white;
text-align:center;
box-shadow:0 10px 35px rgba(0,0,0,0.25);
animation:fade 1s;
}

.login-box img{
width:90px;
margin-bottom:15px;
}

.login-box h1{
font-size:48px;
margin-bottom:10px;
}

.login-box p{
opacity:0.8;
margin-bottom:35px;
}

.input-box{
margin-bottom:22px;
position:relative;
}

.input-box input{
width:100%;
padding:18px 20px;
border:none;
border-radius:15px;
font-size:17px;
outline:none;
background:rgba(255,255,255,0.15);
color:white;
}

.input-box i{
position:absolute;
right:20px;
top:20px;
}

input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:white;
color:#2563eb;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.register{
margin-top:20px;
}

.register a{
color:white;
font-weight:bold;
text-decoration:none;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<form class="login-box" method="POST">

<img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">

<h1>HDMIS</h1>

<p>Health Data Management Information System</p>

<div class="input-box">
<input type="email" name="email" placeholder="Enter Email" required>
<i class="fa-solid fa-envelope"></i>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="Enter Password" required>
<i class="fa-solid fa-lock"></i>
</div>

<button type="submit">Login</button>

<div class="register">
Don't have account?
<a href="/register">Create Account</a>
</div>

</form>

</body>
</html>
