<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMIS Navbar</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f1f5f9;
        }

        .navbar{
            width:100%;
            height:85px;
            background:linear-gradient(90deg,#0f172a,#1e3a8a,#2563eb);
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 40px;
            box-shadow:0 4px 20px rgba(0,0,0,0.2);
            position:sticky;
            top:0;
            z-index:1000;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:15px;
            color:white;
            text-decoration:none;
        }

        .logo-icon{
            font-size:38px;
        }

        .logo-text{
            display:flex;
            flex-direction:column;
        }

        .logo-text h1{
            font-size:30px;
            font-weight:700;
            line-height:1;
        }

        .logo-text span{
            font-size:12px;
            color:#dbeafe;
            letter-spacing:1px;
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            padding:12px 18px;
            border-radius:12px;
            transition:0.3s;
            font-size:15px;
            font-weight:500;
        }

        .nav-links a:hover{
            background:rgba(255,255,255,0.15);
            transform:translateY(-2px);
        }

        .logout-btn{
            background:#facc15;
            color:black !important;
            font-weight:700 !important;
        }

        .logout-btn:hover{
            background:#fde047 !important;
        }

        .dark-btn{
            background:#111827;
        }

        .dark-btn:hover{
            background:#1f2937 !important;
        }

        .mobile-menu{
            display:none;
            font-size:30px;
            color:white;
            cursor:pointer;
        }

        @media(max-width:1100px){

            .nav-links{
                position:absolute;
                top:85px;
                left:0;
                width:100%;
                background:#1e3a8a;
                flex-direction:column;
                padding:20px;
                display:none;
            }

            .nav-links.active{
                display:flex;
            }

            .mobile-menu{
                display:block;
            }

        }

    </style>

</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">

        <div class="logo-icon">🏥</div>

        <div class="logo-text">
            <h1>HDMIS</h1>
            <span>Health Data Management System</span>
        </div>

    </a>

    <div class="mobile-menu" onclick="toggleMenu()">
        ☰
    </div>

    <div class="nav-links" id="navLinks">

        <a href="/patient-dashboard">👤 Patient</a>

        <a href="/doctor-dashboard">🩺 Doctor</a>

        <a href="/admin-dashboard">🛡️ Admin</a>

        <a href="/appointment">📅 Appointment</a>

        <a href="/history">📜 History</a>

        <a href="/ai-prediction">🤖 AI Prediction</a>

        <a href="/chatbot">💬 AI Chatbot</a>

        <a href="#" class="dark-btn" onclick="toggleDarkMode()">🌙 Dark</a>

        <a href="/logout" class="logout-btn">Logout</a>

    </div>

</nav>

<script>

function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}

function toggleDarkMode(){

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        document.body.style.background="#0f172a";
    }
    else{
        document.body.style.background="#f1f5f9";
    }
}

</script>

<script src="/static/darkmode.js"></script>

</body>
</html>
