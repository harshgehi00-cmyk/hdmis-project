<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
font-family:Poppins;
background:#eef2ff;
padding:40px;
}

.chat-box{
max-width:900px;
margin:auto;
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
margin-bottom:30px;
color:#1e3a8a;
}

textarea{
width:100%;
height:130px;
padding:20px;
border-radius:18px;
border:1px solid #ddd;
font-size:16px;
outline:none;
}

button{
margin-top:20px;
padding:16px 30px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
}

.response{
margin-top:30px;
padding:25px;
background:#f3f4f6;
border-radius:20px;
line-height:1.8;
}

</style>

</head>

<body>

<div class="chat-box">

<h1>
<i class="fa-solid fa-robot"></i>
AI Medical Chatbot
</h1>

<form method="POST">

<textarea
name="question"
placeholder="Ask your medical question..."
required></textarea>

<button type="submit">
Ask AI
</button>

</form>

{% if response %}

<div class="response">

{{ response }}

</div>

{% endif %}

</div>

</body>
</html>
